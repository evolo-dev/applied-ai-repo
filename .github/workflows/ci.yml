name: CI Pipeline Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate markdown syntax
        run: |
          echo "Checking README for basic structure..."
          grep -q "^# Applied AI Engineering$" README.md || exit 1
          grep -q "^## Services" README.md || exit 1
          echo "✓ Markdown structure validated"
      
      - name: Validate pipeline docs exist
        run: |
          if [ ! -f "pipeline/INGEST.md" ] && [ ! -f "pipeline/EXTRACT.md" ]; then
            echo "✗ Missing INGEST.md or EXTRACT.md"
            exit 1
          fi
          echo "✓ Pipeline documentation present"
      
      - name: Report status
        run: |
          echo ""
          echo "Pipeline validation complete:"
          echo "  • Services documented ✅"
          echo "  • Ingestion layer documented ✅"  
          echo "  • Extraction layer documented ✅"
          echo ""
          echo "Ready for production integration review."
